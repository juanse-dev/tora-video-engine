name: CI

on:
  push:
    branches:
      - main
      - "mvp-*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Lint and typecheck
        run: npm run lint

      - name: Build static web player
        run: npm run web:build

      - name: Verify static web artifact
        shell: bash
        run: |
          test -s dist/web/index.html
          test -s dist/web/characters/tora/formal.png
          test -s dist/web/characters/tora/confused.png
          test -s dist/web/characters/tora/panic.png
          test -s dist/web/characters/tora/coffee.png
          test -s dist/web/backgrounds/office.png
          test -s dist/web/backgrounds/server-room.png

      - name: Upload static web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-static-build
          path: dist/web
          if-no-files-found: error
          retention-days: 7

      - name: Verify required browser render golden
        run: npx playwright test --config=playwright.browser-render.config.mjs

      - name: Verify local assets persist across reload, restart and a new build
        run: npm run test:persistence

      - name: Verify the deployed-gate suite against a local build
        env:
          TORA_REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: |
          npm run gate -- --url=local --phase=A
          npm run gate -- --url=local --phase=B

      - name: Upload gate report and artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-local
          path: |
            .gate/local/
            !.gate/local/profile/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Player resource buffering
        run: npm run test:browser

      - name: Verify asset library IndexedDB harness
        run: npm run test:harness

      - name: Render PR smoke story
        if: github.event_name == 'pull_request'
        env:
          TORA_REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run video -- stories/ci-smoke.yaml

      - name: Verify PR smoke artifact
        if: github.event_name == 'pull_request'
        run: test -s output/ci-smoke.mp4

      - name: Render reference story
        env:
          TORA_REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run video -- stories/friday-deploy.yaml

      - name: Verify reference artifact
        run: test -s output/friday-deploy.mp4

      - name: Upload reference render
        uses: actions/upload-artifact@v4
        with:
          name: mvp-reference-render
          path: output/friday-deploy.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Reject stale output after validation failure
        shell: bash
        run: |
          mkdir -p output
          printf 'stale' > output/friday-deploy.mp4
          printf 'title: Broken\nscenes: []\n' > /tmp/friday-deploy.yaml
          if npm run video -- /tmp/friday-deploy.yaml; then
            echo "Expected invalid story render to fail"
            exit 1
          fi
          test ! -e output/friday-deploy.mp4

      - name: Verify CLI local assets render
        env:
          TORA_REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome
        run: npm run test:cli-e2e
