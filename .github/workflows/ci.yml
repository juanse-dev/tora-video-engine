name: CI

on:
  push:
    branches:
      - main
      - "mvp-*"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Lint and typecheck
        run: npm run lint

      - name: Render demo reel
        run: npm run video -- stories/demo-reel.yaml

      - name: Verify artifact
        run: test -s output/demo-reel.mp4

      - name: Upload demo reel
        uses: actions/upload-artifact@v4
        with:
          name: tora-video-engine-demo-reel
          path: output/demo-reel.mp4
          if-no-files-found: error
          retention-days: 7

      - name: Reject stale output after validation failure
        shell: bash
        run: |
          printf 'title: Broken\nscenes: []\n' > /tmp/demo-reel.yaml
          if npm run video -- /tmp/demo-reel.yaml; then
            echo "Expected invalid story render to fail"
            exit 1
          fi
          test ! -e output/demo-reel.mp4
