name: CI

on:
  push:
    branches:
      - main
      - "mvp-*"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npm test

      - name: Lint and typecheck
        run: npm run lint

      - name: Render reference story
        run: npm run video -- stories/friday-deploy.yaml

      - name: Verify artifact
        run: test -s output/friday-deploy.mp4
